name: Submit a Jev project or video
description: Suggest a creative Jev project or substantive video for jevfast.com.
title: "[Submission] "
body:
  - type: markdown
    attributes:
      value: "Suggest your own project or someone else's. Check the [Candidates list](https://jevfast.com/submit/#candidates) first and do not resubmit an item already shown there. Issues are public; do not include secrets or private information. Inclusion is not guaranteed."
  - type: input
    id: project-name
    attributes:
      label: Project or video name
      description: The name can be the title of a video.
      placeholder: Name or title
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Primary public URL
      description: Link to the GitHub repository, X post, project website, or video.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: jev-use
    attributes:
      label: How does it use Jev?
      description: Briefly describe what it does, Jev's role, and what makes it interesting. For a video, explain what it teaches or demonstrates about Jev.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Available evidence
      options:
        - Idea only
        - Demo
        - Code available
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: Creator credit
      description: Public name, handle, or profile URL, if known.
  - type: textarea
    id: supporting-links
    attributes:
      label: Demo, code, or media links
      description: Optional public links to a working demo, repository, video, image, or creator post. Choose Demo above when the primary evidence is a playable video.
  - type: dropdown
    id: frequency
    attributes:
      label: How often does Jev run?
      options:
        - Unknown
        - Realtime or nearly
        - On demand or infrequently
      default: 0
  - type: textarea
    id: frequency-evidence
    attributes:
      label: Frequency evidence
      description: Optional source or measurement for actual Jev calls. Animation speed and model response latency alone do not establish call frequency.
